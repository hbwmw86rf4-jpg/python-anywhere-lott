<!DOCTYPE html>
<html>
<head>
    <title>Manager Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; font-weight: bold; font-size: 14px;}
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        input[type="password"] { width: 90%; padding: 10px; margin: 15px 0; font-size: 18px; text-align: center; border: 2px solid #ccc; border-radius: 4px; }
        button { background-color: #0056b3; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        a { display: block; margin-top: 15px; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Manager Access</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/manager_login">
            <input type="password" name="pin" placeholder="Enter PIN" required autofocus autocomplete="off">
            <button type="submit">Unlock Backroom</button>
        </form>
        <a href="/">⬅ Back to Scanner</a>
    </div>
</body>
</html>
